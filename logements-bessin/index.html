    if (!LV[n] || !P[n] || typeof P[n] !== 'object') { delete P[n]; continue; }
    for (const f of Object.keys(P[n])) {
      if (!(f in DEF) || P[n][f] === baseVal(n, f)) delete P[n][f];
    }
    if (!Object.keys(P[n]).length) delete P[n];
  }
  persistP();
}
function persistP() { if (Object.keys(P).length) store.set(KEY_P, P); else store.del(KEY_P); }
function applyField(n, f, v) {
  if (val(n)[f] === v) return false;
  P[n] = P[n] || {};
  if (v === baseVal(n, f)) delete P[n][f]; else P[n][f] = v;
  if (!Object.keys(P[n]).length) delete P[n];
  return true;
}
function setFields(n, obj, opts) { let ch = false; for (const f in obj) if (applyField(n, f, obj[f])) ch = true; if (ch) { persistP(); render(opts); } }
const setField = (n, f, v, opts) => setFields(n, { [f]: v }, opts);
function mergedState() {
  const L = {};
  ALL.forEach(({ n }) => { const v = val(n), c = {}; for (const f in DEF) if (v[f] !== DEF[f]) c[f] = v[f]; if (Object.keys(c).length) L[n] = c; });

}

const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

const fDM = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'long' });
const fDMY = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });

  if (s === iso(t)) return 'Demain';
  return fDay.format(parseISO(s));

const timeLabel = (h) => { if (!h) return ''; const [H, M] = h.split(':'); return Number(H) + 'h' + M; };

async function save() {
  if (saving) return;
  await ready;
  if (!canWrite || !ART) { canWrite = false; render(); toast(`Mode consultation${NB}: vos saisies restent sur cet appareil.`); return; }
  const next = mergedState();
  const html = pageHTML(next);
  saving = true; renderBar();
  store.set(KEY_SAVED, Date.now(), true); persistUI();
  let err = null;
  for (let i = 0; i < 2; i++) {
    try { await ART.publish(html); err = null; break; }
    catch (e) { err = e || { code: 'upstream_error' }; if (err.code === 'upstream_error' && i === 0) { await sleep(700 + Math.random() * 900); continue; } break; }
  }
  saving = false;
  if (!err) { S = next; P = {}; persistP(); render(); toast('Enregistré. La mise à jour est visible par tous.'); return; }
  const c = err.code;
  if (c === 'conflict') { renderBar(); toast('Quelqu’un a enregistré en même temps. La page se recharge, vos modifications restent en attente.'); return; }
  store.del(KEY_SAVED, true);
  if (['not_writer', 'not_granted', 'consent_required', 'capability_disabled', 'capability_removed', 'not_declared'].includes(c)) {
    canWrite = false; render(); toast(`Vous n’avez pas les droits d’enregistrement${NB}: vos saisies restent sur cet appareil.`); return;
  }
  renderBar();
  toast(c === 'rate_limited' ? `Trop d’enregistrements rapprochés${NB}: réessayez dans un instant.` : `Enregistrement impossible (${c || 'erreur'}). Vos modifications sont conservées.`);
}

function csv() {
  const rows = [['Logement', 'Étage', 'Occupation', 'Réserves en cours', 'Détail des réserves', 'Rendez-vous', 'Heure', 'Réserves levées', 'Note']];
  ORDER.forEach((n) => {
    const v = val(n), r = res(n);
    rows.push([n, LV[n], OCC[v.o], r.length, r.map((x) => `n° ${x.id} ${x.t}`).join(' | '), v.d ? parseISO(v.d).toLocaleDateString('fr-FR') : '', v.h ? timeLabel(v.h) : '', v.x ? 'Oui' : (r.length ? 'Non' : ''), v.n]);
  });
  return '\uFEFF' + rows.map((r) => r.map((c) => { c = String(c == null ? '' : c); return /[;"\n\r]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(';')).join('\r\n');
}

    toast(`Téléchargement impossible (${c || 'erreur'}).`);
  }
}

async function blobSave({ filename, data }) {
  const url = URL.createObjectURL(new Blob([data], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return { status: 'saved' };
}
function parseCSV(t) {
  t = t.replace(/^\uFEFF/, '');
  const sep = (t.split(/\r?\n/)[0].match(/;/g) || []).length >= (t.split(/\r?\n/)[0].match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim() !== ''));
}
async function importFile(file) {
  let rows;
  try { rows = parseCSV(await file.text()); } catch (e) { toast('Fichier illisible.'); return; }
  const norm = (x) => String(x || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const head = (rows.shift() || []).map(norm);
  const col = (name) => head.findIndex((h) => h.startsWith(name));
  const iN = col('logement'), iO = col('occupation'), iD = col('rendez-vous'), iH = col('heure'), iX = col('reserves levees'), iT = col('note');
  if (iN < 0) { toast('Colonne «' + NB + 'Logement' + NB + '» introuvable dans le fichier.'); return; }
  const touched = new Set();
  rows.forEach((r) => {
    const n = String(r[iN] || '').trim(); if (!LV[n]) return;
    const upd = {};
    const o = norm(r[iO]);
    if (o.startsWith('occup')) upd.o = 'occ'; else if (o.startsWith('vacant')) upd.o = 'vac';
    const d = String(r[iD] || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (d) upd.d = d[3] + '-' + d[2].padStart(2, '0') + '-' + d[1].padStart(2, '0');
    const h = String(r[iH] || '').trim().match(/^(\d{1,2})\s*[h:]\s*(\d{2})?$/i);
    if (h) upd.h = h[1].padStart(2, '0') + ':' + (h[2] || '00');
    if (norm(r[iX]) === 'oui') upd.x = true;
    const note = iT >= 0 ? String(r[iT] || '').trim() : '';
    if (note) upd.n = note;
    let ch = false; for (const k in upd) if (applyField(n, k, upd[k])) ch = true;
    if (ch) touched.add(n);
  });
  persistP(); render();
  toast(touched.size ? `Tableau importé${NB}: ${touched.size} ${plural(touched.size, 'logement mis', 'logements mis')} à jour. Vérifiez puis enregistrez.` : 'Aucune différence avec le suivi actuel.');
}

let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 4500); }

/* ---------- événements ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-brush],[data-act],.win');
  if (!t) return;
  if (t.classList.contains('win')) {
    const n = t.dataset.n;
    if (ui.brush === 'fiche') openDetail(n);
    else setField(n, 'o', ui.brush === 'unk' ? '' : ui.brush);
    return;
  }
  if (t.dataset.brush) { ui.brush = t.dataset.brush; persistUI(); renderMode(); return; }
  const a = t.dataset.act;
  if (a === 'open') openDetail(t.dataset.n);
  else if (a === 'go') { if (t.dataset.to) openDetail(t.dataset.to); }
  else if (a === 'close') closeDetail();
  else if (a === 'occ') { if (ui.sel) setField(ui.sel, 'o', t.dataset.o || ''); }
  else if (a === 'clear') { if (ui.sel) setFields(ui.sel, { d: '', h: '' }); }
  else if (a === 'save') save();
  else if (a === 'discard') discard();
  else if (a === 'download') download();
  else if (a === 'import') $('#impfile').click();
});
document.addEventListener('change', (e) => { if (e.target.id === 'impfile' && e.target.files && e.target.files[0]) { importFile(e.target.files[0]); e.target.value = ''; } });
document.addEventListener('change', (e) => {
  const t = e.target; if (!ui.sel) return;
  if (t.id === 'f-date') setField(ui.sel, 'd', t.value || '', { detail: false });
  else if (t.id === 'f-time') setField(ui.sel, 'h', t.value || '', { detail: false });
  else if (t.id === 'f-done') setField(ui.sel, 'x', !!t.checked, { detail: false });
});
document.addEventListener('input', (e) => { if (e.target.id === 'f-note' && ui.sel) setField(ui.sel, 'n', e.target.value, { detail: false }); });
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (ui.sel) closeDetail();
  else if (ui.brush !== 'fiche') { ui.brush = 'fiche'; persistUI(); renderMode(); }
});
let scrollT;
window.addEventListener('scroll', () => { clearTimeout(scrollT); scrollT = setTimeout(persistUI, 250); }, { passive: true });

/* ---------- démarrage ---------- */
cleanPending();
renderMode();
render();
if (ui.y) requestAnimationFrame(() => window.scrollTo(0, ui.y));
const savedAt = store.get(KEY_SAVED, true);
if (savedAt) {
  store.del(KEY_SAVED, true);
  if (Date.now() - savedAt < 60000) toast(Object.keys(P).length ? `Quelqu’un a enregistré en même temps${NB}: vos modifications sont en attente, vérifiez puis enregistrez.` : 'Enregistré.');
}

const ready = (async () => {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { canWrite = false; DL = { save: blobSave }; render(); return; }
  const use = (nm) => { try { return Promise.resolve(c.use(nm)).catch(() => null); } catch (e) { return Promise.resolve(null); } };
  const [a, d, u] = await Promise.all([use('artifact'), use('downloads'), use('user')]);
  ART = a; DL = d;
  if (!ART) canWrite = false;
  else if (u && typeof u.canEdit === 'function') { try { canWrite = !!(await u.canEdit()); } catch (e) { canWrite = true; } }
  else canWrite = true;
  render();
})();
})();
</script>
</body>
</html>
