<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schéma de principe plomberie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<script defer src="vendor/jspdf.umd.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--steel:#dcdfdc;--panel:#eef0ed;--panel-2:#e3e6e2;--field:#fff;--rule:#c1c6c0;--rule-soft:#d5d9d4;--text:#1e2326;--muted:#5a636a;
--accent:#2b7a3b;--accent-hover:#22662f;--accent-tint:#d8ebdb;--on-accent:#fff;--plate:#fafbf9;--paper:#fff;--ink:#16191b;--muted-ink:#6b7378;--hdr:#ececec;
--grid-dot:#c3cacf;--grid-line:#e6eaec;--sel:#2c9a46;--danger:#b3261e;--shadow:0 12px 32px rgba(18,28,22,.18);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--steel:#171a1c;--panel:#1f2326;--panel-2:#272c30;--field:#14171a;--rule:#3a4146;--rule-soft:#2d3337;--text:#e2e6e3;--muted:#9da6aa;--accent:#5cb36a;--accent-hover:#73c37f;--accent-tint:#203528;--on-accent:#0d1a11;--plate:#252a2e;--paper:#f2f4f1;--grid-dot:#bcc3c8;--grid-line:#dde2e4;--danger:#f2726a;--shadow:0 14px 36px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--steel:#171a1c;--panel:#1f2326;--panel-2:#272c30;--field:#14171a;--rule:#3a4146;--rule-soft:#2d3337;--text:#e2e6e3;--muted:#9da6aa;--accent:#5cb36a;--accent-hover:#73c37f;--accent-tint:#203528;--on-accent:#0d1a11;--plate:#252a2e;--paper:#f2f4f1;--grid-dot:#bcc3c8;--grid-line:#dde2e4;--danger:#f2726a;--shadow:0 14px 36px rgba(0,0,0,.5);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--steel);color:var(--text);font:14px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
#app{height:100%;display:grid;grid-template-columns:252px minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top top" "pal stage insp" "foot foot foot"}
#top{grid-area:top;display:flex;align-items:center;gap:3px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none;z-index:5}
#top::-webkit-scrollbar{display:none}
.plate{display:flex;align-items:stretch;flex:none;height:38px;margin-right:8px;background:var(--plate);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.plate i{width:8px;background:var(--accent);flex:none}
.plate .ttl{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:0 12px 0 10px}
.plate b{font:700 14px/1.05 "Barlow Semi Condensed",Barlow,sans-serif;white-space:nowrap}
.plate input{border:0;background:transparent;padding:0;margin:0;font:500 12.5px/1.15 Barlow,sans-serif;color:var(--muted);width:160px;outline:none}
.plate input:focus{color:var(--text)}
.btn{height:34px;min-width:34px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:6px;background:transparent;cursor:pointer;font:600 13.5px/1 "Barlow Semi Condensed",Barlow,sans-serif;white-space:nowrap;flex:none;color:var(--text)}
.btn:hover{background:var(--panel-2);border-color:var(--rule-soft)}
.btn:disabled{opacity:.38;cursor:default;background:transparent;border-color:transparent}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.ghost{border-color:var(--rule);background:var(--panel)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{color:var(--danger)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sep{width:1px;height:24px;background:var(--rule);margin:0 5px;flex:none}
.spacer{flex:1 0 8px}
.sw{display:inline-block;width:22px;height:5px;border-radius:3px;flex:none;background:#999}
.netbtn{gap:7px;border-color:var(--rule)}
.zoomv{min-width:48px;text-align:center;font:600 13px "Barlow Semi Condensed",Barlow,sans-serif;color:var(--muted);flex:none}
.mob{display:none}
#pal{grid-area:pal;background:var(--panel);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.pal-head{padding:10px 10px 8px;border-bottom:1px solid var(--rule-soft)}
.search{width:100%;height:32px;border:1px solid var(--rule);border-radius:6px;background:var(--field);padding:0 10px;font-size:13.5px}
.pal-list{overflow:auto;min-height:0;flex:1;padding:2px 8px 18px;overscroll-behavior:contain}
.cat summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:11px 4px 7px;font:700 14px "Barlow Semi Condensed",Barlow,sans-serif}
.cat summary::-webkit-details-marker{display:none}
.cat summary .cnt{margin-left:auto;font:500 12px Barlow,sans-serif;color:var(--muted)}
.cat summary::after{content:"";width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg);margin:0 3px 4px 4px}
.cat:not([open]) summary::after{transform:rotate(-45deg);margin-bottom:0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding-bottom:6px}
.tile{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:4px 4px 6px;border:1px solid var(--rule-soft);border-radius:7px;background:var(--panel-2);cursor:pointer;text-align:center;font:500 11px/1.15 Barlow,sans-serif;color:var(--text);min-width:0;touch-action:pan-y}
.tile svg{display:block;width:100%;height:42px;background:var(--paper);border-radius:4px;pointer-events:none}
.tile svg *,.th svg *{vector-effect:non-scaling-stroke}
.tile span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.3em}
.tile:hover{border-color:var(--accent)}
.tile.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-tint)}
#stage{grid-area:stage;position:relative;min-width:0;min-height:0;background:var(--paper);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;font-family:Arial,Helvetica,"Liberation Sans",sans-serif}
#cv.t-pipe,#cv.t-place,#cv.t-text,#cv.t-zone{cursor:crosshair}
#cv.t-hand,#cv.pan-ready{cursor:grab}
#cv.panning{cursor:grabbing}
#cv.t-select [data-hit="item"],#cv.t-select [data-hit="label"]{cursor:move}
#lu{pointer-events:none}
#lu .hdl{pointer-events:all}
.selbox{fill:none;stroke:var(--sel)}
.hdl{fill:#fff;stroke:var(--sel)}
.hdl.vh{cursor:move}.hdl.ns{cursor:ns-resize}.hdl.ew{cursor:ew-resize}.hdl.nwse{cursor:nwse-resize}.hdl.nesw{cursor:nesw-resize}
.rubber{fill:rgba(44,154,70,.08);stroke:var(--sel)}
.rubber.cross{fill:rgba(28,126,214,.07);stroke:#1c7ed6}
.portmark{fill:#fff;stroke:var(--sel)}
.badge{fill:var(--paper);stroke:var(--sel)}.badge.ok{stroke:var(--paper)}
.badge-t{fill:var(--ink)}.badge-t.ok{fill:#fff}
.badge-lead{stroke:var(--sel)}
.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:20px}
.empty-card{pointer-events:auto;max-width:440px;background:var(--plate);border:1px solid var(--rule);border-radius:10px;padding:20px 22px 22px;box-shadow:var(--shadow);color:var(--text)}
.empty-card svg{display:block;width:100%;height:58px;margin-bottom:10px;background:#fff;border-radius:6px}
.empty-card h2{margin:0 0 6px;font:700 22px/1.15 "Barlow Semi Condensed",Barlow,sans-serif}
.empty-card p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.45}
.empty-acts{display:flex;flex-wrap:wrap;gap:8px}
.draftbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;background:var(--plate);border:1px solid var(--rule);border-radius:9px;box-shadow:var(--shadow);z-index:3}
#insp{grid-area:insp;background:var(--panel);border-left:1px solid var(--rule);overflow:auto;min-height:0;overscroll-behavior:contain}
.ins-head{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;border-bottom:1px solid var(--rule-soft)}
.th{width:64px;height:46px;flex:none;background:var(--paper);border:1px solid var(--rule-soft);border-radius:6px;overflow:hidden}
.th svg{width:100%;height:100%;display:block}
.ins-type{font:700 16px/1.15 "Barlow Semi Condensed",Barlow,sans-serif}
.ins-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.sec{padding:12px 16px 14px;border-bottom:1px solid var(--rule-soft)}
.sec h3{margin:0 0 9px;font:700 14px "Barlow Semi Condensed",Barlow,sans-serif}
.f{margin:0 0 10px}.f:last-child{margin-bottom:0}
.f .lab{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:4px;min-height:18px}
.inp{width:100%;height:32px;border:1px solid var(--rule);border-radius:6px;background:var(--field);padding:0 9px;font-size:13.5px;color:var(--text)}
textarea.inp{height:auto;min-height:64px;padding:7px 9px;resize:vertical;line-height:1.35}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-tint)}
input[type=color]{width:44px;height:32px;padding:2px 3px;border:1px solid var(--rule);border-radius:6px;background:var(--field);cursor:pointer;flex:none}
input[type=range]{width:100%;accent-color:var(--accent)}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--text);user-select:none}
.chk input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.orient{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.orient .btn{border-color:var(--rule);background:var(--panel);height:46px;flex-direction:column;gap:3px;font-size:11.5px;padding:4px 2px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0;line-height:1.4}
.nets{display:flex;flex-direction:column;gap:6px}
.net{display:grid;grid-template-columns:40px 34px 52px minmax(0,1fr) 30px;gap:5px;align-items:center;padding:5px;border:1px solid var(--rule-soft);border-radius:7px;background:var(--panel-2)}
.net.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.net .inp{height:28px;padding:0 6px;font-size:13px}
.net input[type=color]{width:34px;height:28px}
.net .pick{height:28px;border:1px solid var(--rule);border-radius:5px;background:var(--field);display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0 4px;font:600 11px Barlow,sans-serif;color:var(--muted)}
.net .pick .sw{width:14px}
.net .more{height:28px;min-width:28px;padding:0}
.net .ext{grid-column:1/-1;display:flex;gap:6px;align-items:center}
.net .ext .inp{flex:1}
kbd{font:600 11px/1 Barlow,sans-serif;padding:3px 5px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;background:var(--panel-2);color:var(--text);white-space:nowrap}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12.5px;align-items:center;justify-items:start}
.itabs{display:flex;gap:4px;padding:8px 16px 0;border-bottom:1px solid var(--rule-soft)}
.itab{flex:1;height:32px;margin-bottom:-1px;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;background:transparent;cursor:pointer;font:600 13.5px "Barlow Semi Condensed",Barlow,sans-serif;color:var(--muted)}
.itab:hover{color:var(--text);background:var(--panel-2)}
.itab.on{color:var(--text);background:var(--panel);border-color:var(--rule-soft);box-shadow:inset 0 2px 0 var(--accent)}
.itab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.racc-fig{background:var(--paper);border:1px solid var(--rule-soft);border-radius:6px;overflow:hidden}
.racc-fig svg{display:block;width:100%;height:auto}
.racc-sum{margin-top:10px;font-size:13px;color:var(--muted)}.racc-sum b{color:var(--text);font-variant-numeric:tabular-nums}
.racc-tip{margin:6px 0 0;font-size:13px;line-height:1.45}
.racc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.racc-row{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;padding:8px;border:1px solid var(--rule-soft);border-radius:7px;background:var(--panel-2)}
.racc-row:hover,.racc-row:focus-within{border-color:var(--accent)}
.rn{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--sel);background:var(--field);color:var(--text);font:700 12px Barlow,sans-serif}
.rn.ok{border-color:transparent;color:#fff}
.rb{min-width:0}
.rt{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 6px;font-size:13.5px;line-height:1.25}
.rside{font-size:12px;color:var(--muted)}
.rs{display:flex;align-items:center;gap:5px;margin-top:3px;font-size:12.5px}.rs.free{color:var(--muted)}
.rs .sw,.chip .sw{width:12px}
.rw{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:5px;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border:1px solid var(--rule);border-radius:10px;background:var(--field);color:var(--text);font:600 11.5px Barlow,sans-serif}
.rbad{margin-top:4px;font-size:12px;color:var(--danger)}
.rtip{margin:5px 0 0;font-size:12.5px;line-height:1.4}
#foot{grid-area:foot;display:flex;align-items:center;gap:14px;padding:5px 12px;background:var(--panel);border-top:1px solid var(--rule);font-size:12.5px;color:var(--muted);min-height:32px;overflow:hidden}
#hint{display:flex;gap:16px;overflow:hidden;white-space:nowrap;flex:1;min-width:0}
#hint span{display:inline-flex;align-items:center;gap:5px}
#coords{flex:none;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(48px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--panel);padding:9px 14px;border-radius:8px;font-size:13.5px;box-shadow:var(--shadow);z-index:80;opacity:0;transition:opacity .18s;pointer-events:none;max-width:min(90vw,520px)}
.toast.show{opacity:1}
.menu{position:fixed;z-index:60;min-width:240px;background:var(--plate);border:1px solid var(--rule);border-radius:9px;box-shadow:var(--shadow);padding:5px;display:flex;flex-direction:column}
.menu-it{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 10px;border:0;background:transparent;border-radius:6px;cursor:pointer;text-align:left;font-size:13.5px;color:var(--text)}
.menu-it:hover,.menu-it:focus-visible{background:var(--panel-2);outline:none}
.menu-it:disabled{opacity:.45;cursor:default;background:transparent}
.menu-it.on{font-weight:600}
.menu-it .grow{flex:1}
.menu-sep{height:1px;background:var(--rule-soft);margin:4px 2px}
.menu-label{font-size:12px;color:var(--muted);padding:7px 10px 3px}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,12,.4);display:grid;place-items:center;z-index:70;padding:16px}
.modal{width:min(520px,100%);max-height:min(80vh,640px);display:flex;flex-direction:column;background:var(--plate);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--rule-soft)}
.modal header h2{margin:0;font:700 18px "Barlow Semi Condensed",Barlow,sans-serif}
.modal .body{padding:14px 16px;overflow:auto}
.modal footer{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--rule-soft)}
.lib-row{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--rule-soft)}
.lib-row .nm{flex:1;min-width:0}
.lib-row b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-row small{color:var(--muted)}
@media (max-width:1180px){.desk{display:none}}
@media (max-width:860px){
#app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "stage" "foot"}
#pal,#insp{position:fixed;top:calc(env(safe-area-inset-top,0px) + 53px);bottom:env(safe-area-inset-bottom,0px);width:min(330px,88vw);z-index:40;box-shadow:var(--shadow);transition:transform .2s ease}
#pal{left:0;transform:translateX(-105%)}
#insp{right:0;transform:translateX(105%)}
#app.show-pal #pal,#app.show-insp #insp{transform:none}
.mob{display:inline-flex}
.plate input{width:110px}
#coords{display:none}
}
@media (prefers-reduced-motion:reduce){.toast,#pal,#insp{transition:none}}
</style>
</head>
<body>
<div id="app">
<header id="top">
<button class="btn mob" id="b-pal" type="button" aria-label="Bibliothèque de symboles"><svg class="ico" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></button>
<div class="plate"><i></i><div class="ttl"><b>Schéma de principe</b><input id="docname" value="Sans titre" aria-label="Nom du schéma" maxlength="80" spellcheck="false" autocomplete="off"></div></div>
<button class="btn" type="button" data-tool="select" title="Sélection (V)"><svg class="ico" viewBox="0 0 24 24"><path d="M6 3.5l12.5 7.2-5.6 1.5-2.8 5.3z"/></svg><span class="desk">Sélection</span></button>
<button class="btn" type="button" data-tool="pipe" title="Tuyauterie (L)"><svg class="ico" viewBox="0 0 24 24"><path d="M3.5 18.5h7v-11h10"/><circle cx="3.5" cy="18.5" r="1.4"/><circle cx="20.5" cy="7.5" r="1.4"/></svg><span class="desk">Tuyauterie</span></button>
<button class="btn netbtn" type="button" id="b-net" data-menu title="Réseau utilisé pour tracer (touches 1 à 9)"><span class="sw" id="net-sw"></span><span id="net-ab">EF</span><svg class="ico" style="width:12px;height:12px" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
<button class="btn" type="button" data-tool="text" title="Texte (T)" aria-label="Texte"><svg class="ico" viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></svg></button>
<button class="btn" type="button" data-tool="zone" title="Zone ou local (Z)" aria-label="Zone"><svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="1" stroke-dasharray="3 2.2"/></svg></button>
<button class="btn" type="button" data-tool="hand" title="Déplacer la vue (H ou Espace)" aria-label="Déplacer la vue"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></svg></button>
<span class="sep"></span>
<button class="btn" type="button" id="b-rl" title="Tourner de −90° (Maj+R)" aria-label="Tourner à gauche"><svg class="ico" viewBox="0 0 24 24"><path d="M4 5v5h5"/><path d="M4.6 14.5A7.5 7.5 0 1 0 6.3 7L4 10"/></svg></button>
