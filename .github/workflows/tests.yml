name: Tests
on:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer Playwright
        run: npm ci && npx playwright install --with-deps chromium
      - name: Construire la page et lancer les tests
        run: npm test
